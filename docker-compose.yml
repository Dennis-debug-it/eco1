# Single-host deployment: PostgreSQL + Ecosys Payroll (API and web app) + nightly encrypted backups.
#   cp .env.example .env   # then set the keys
#   docker compose up -d --build                                                    # local / trial, http://localhost:8080
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build   # production: HTTPS via Caddy on 443
# See docs/operations.md for backups, restores, upgrades and monitoring.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecosys_payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d ecosys_payroll"]
      interval: 5s
      timeout: 3s
      retries: 20

  payroll:
    build: .
    image: ecosys/payroll:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Payroll: Host=db;Port=5432;Database=ecosys_payroll;Username=payroll;Password=${POSTGRES_PASSWORD}
      Payroll__Encryption__Key: ${PAYROLL_ENCRYPTION_KEY:?set PAYROLL_ENCRYPTION_KEY in .env}
      Payroll__SeedDemoData: ${SEED_DEMO_DATA:-false}
      Payroll__AllowDemoData: ${ALLOW_DEMO_DATA:-false}
      Payroll__PortalUrl: ${PORTAL_URL:-http://localhost:8080}
      Auth__Mode: ${AUTH_MODE:-Local}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-}
      Auth__Authority: ${AUTH_AUTHORITY:-}
      Auth__Audience: ${AUTH_AUDIENCE:-ecosys-payroll}
      Notifications__Provider: ${NOTIFICATIONS_PROVIDER:-Log}
      Notifications__Ecosys__BaseUrl: ${NOTIFICATIONS_BASE_URL:-}
      Notifications__Ecosys__ApiKey: ${NOTIFICATIONS_API_KEY:-}
      Cors__Origins__0: ${PORTAL_URL:-http://localhost:8080}
      Payroll__TimeZone: Africa/Nairobi
      Payroll__Retention__EmployeeRecordYears: ${RETENTION_EMPLOYEE_YEARS:-7}
      Saas__Enabled: ${SAAS_ENABLED:-false}
      Saas__SignupEnabled: ${SAAS_SIGNUP_ENABLED:-true}
      Saas__TrialDays: ${SAAS_TRIAL_DAYS:-14}
      Saas__GraceDays: ${SAAS_GRACE_DAYS:-7}
      Saas__InvoiceDueDays: ${SAAS_INVOICE_DUE_DAYS:-14}
      Saas__VatRate: ${SAAS_VAT_RATE:-0.16}
      Saas__SellerName: ${SAAS_SELLER_NAME:-}
      Saas__SellerTaxPin: ${SAAS_SELLER_TAX_PIN:-}
      Saas__SellerAddress: ${SAAS_SELLER_ADDRESS:-}
      Saas__SupportEmail: ${SAAS_SUPPORT_EMAIL:-}
      Saas__PaymentInstructions: ${SAAS_PAYMENT_INSTRUCTIONS:-}
      TZ: Africa/Nairobi

  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    image: ecosys/payroll-backup:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: payroll
      PGDATABASE: ecosys_payroll
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_AT: ${BACKUP_AT:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      TZ: Africa/Nairobi
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups

volumes:
  pgdata:
